###################
### KEYBINDINGS ###
###################

$mainMod = SUPER
$sizeChange = 20

# 🧱 Kill the focused window
bind = $mainMod, Q, killactive,

# 🚪 Exit Hyprland
bind = $mainMod SHIFT, Q, exit,

# 🖥️ Toggle fullscreen
bind = $mainMod, F, fullscreen,

# 🪟 Toggle floating mode
bind = $mainMod, Space, togglefloating,

# 🌀 Toggle pseudo tiling
bind = $mainMod, P, pseudo,

# ➗ Toggle split layout
bind = $mainMod, S, togglesplit,

# ⚡ Launch terminal (kitty)
bind = $mainMod, Backspace, exec, kitty

# 📁 Open file manager (Dolphin)
bind = $mainMod, E, exec, dolphin

# 🚀 App launcher (wofi)
bind = $mainMod, R, exec, wofi --conf ~/.config/wofi/config/config --style ~/.config/wofi/src/mocha/style.css

# 🧭 Move focus left (VIM style / AZERTY H)
bind = $mainMod, H, movefocus, l

# ⬇️ Move focus down (AZERTY J)
bind = $mainMod, J, movefocus, d

# ⬆️ Move focus up (AZERTY K)
bind = $mainMod, K, movefocus, u

# ➡️ Move focus right (AZERTY L)
bind = $mainMod, L, movefocus, r

# 📦 Move window left
bind = $mainMod SHIFT, H, movewindow, l

# 📦 Move window down
bind = $mainMod SHIFT, J, movewindow, d

# 📦 Move window up
bind = $mainMod SHIFT, K, movewindow, u

# 📦 Move window right
bind = $mainMod SHIFT, L, movewindow, r

# 📏 Resize window left
bind = $mainMod ALT, H, resizeactive, -$sizeChange 0

# 📏 Resize window down
bind = $mainMod ALT, J, resizeactive, 0 $sizeChange

# 📏 Resize window up
bind = $mainMod ALT, K, resizeactive, 0 -$sizeChange

# 📏 Resize window right
bind = $mainMod ALT, L, resizeactive, $sizeChange 0

# 🔢 Switch to workspace 1
bind = $mainMod, ampersand, workspace, 1

# 🔢 Switch to workspace 2
bind = $mainMod, eacute, workspace, 2

# 🔢 Switch to workspace 3
bind = $mainMod, quotedbl, workspace, 3

# 🔢 Switch to workspace 4
bind = $mainMod, apostrophe, workspace, 4

# 🔢 Switch to workspace 5
bind = $mainMod, parenleft, workspace, 5

# 🔢 Switch to workspace 6
bind = $mainMod, minus, workspace, 6

# 🔢 Switch to workspace 7
bind = $mainMod, egrave, workspace, 7

# 🔢 Switch to workspace 8
bind = $mainMod, underscore, workspace, 8

# 🔢 Switch to workspace 9
bind = $mainMod, ccedilla, workspace, 9

# 🔢 Switch to workspace 10
bind = $mainMod, agrave, workspace, 10

# 📤 Move window to workspace 1
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1

# 📤 Move window to workspace 2
bind = $mainMod SHIFT, eacute, movetoworkspace, 2

# 📤 Move window to workspace 3
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3

# 📤 Move window to workspace 4
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4

# 📤 Move window to workspace 5
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5

# 📤 Move window to workspace 6
bind = $mainMod SHIFT, minus, movetoworkspace, 6

# 📤 Move window to workspace 7
bind = $mainMod SHIFT, egrave, movetoworkspace, 7

# 📤 Move window to workspace 8
bind = $mainMod SHIFT, underscore, movetoworkspace, 8

# 📤 Move window to workspace 9
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9

# 📤 Move window to workspace 10
bind = $mainMod SHIFT, agrave, movetoworkspace, 10

# ⏩ Go to next workspace
bind = $mainMod, right, workspace, e+1

# ⏪ Go to previous workspace
bind = $mainMod, left, workspace, e-1

# 📤 Move window to next workspace
bind = $mainMod SHIFT, right, movetoworkspace, e+1

# 📤 Move window to previous workspace
bind = $mainMod SHIFT, left, movetoworkspace, e-1

# 🔁 Restart Waybar
bind = $mainMod SHIFT, W, exec, killall waybar || waybar

# 🖱️ Drag window with mouse
bindm = $mainMod, mouse:272, movewindow

# 🖱️ Resize window with mouse
bindm = $mainMod, mouse:273, resizewindow

# 🔊 Volume up
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# 🔉 Volume down
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# 🔇 Mute audio
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# 🎙️ Mute microphone
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# 💡 Increase screen brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+

# 🌑 Decrease screen brightness
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# ⏭️ Next track
bindl = , XF86AudioNext, exec, playerctl next

# ⏯️ Play/pause
bindl = , XF86AudioPause, exec, playerctl play-pause

# ▶️ Play/pause
bindl = , XF86AudioPlay, exec, playerctl play-pause

# ⏮️ Previous track
bindl = , XF86AudioPrev, exec, playerctl previous

# --- Fullscreen Screenshot ---
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/hyprshot_named.sh output

# --- Region Screenshot ---
bind = , Print, exec, ~/.config/hypr/scripts/hyprshot_named.sh region
bind = $mainMod SHIFT, Print, exec, ~/.config/hypr/scripts/hyprshot_named.sh region freeze
 
# --- Active Window Screenshot ---
bind = $mainMod ALT, Print, exec, ~/.config/hypr/scripts/hyprshot_named.sh window

