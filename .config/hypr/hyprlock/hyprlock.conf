# Import Catppuccin Mocha theme
source = $HOME/.config/hypr/mocha.conf

# Define accent colors and font
$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# GENERAL SETTINGS
general {
  hide_cursor = true
}

# BACKGROUND SETTINGS
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 10
    noise = 0.02
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# TIME LABEL
label {
  monitor =
  text = cmd[update:1000] date +"%H:%M:%S"
  color = $text
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE LABEL
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

