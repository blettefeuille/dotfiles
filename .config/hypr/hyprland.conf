# Hyprland Configuration Template
# ------------------------------------------------------------

# CATPPUCCIN
source = ~/.config/hypr/mocha.conf

# ░░░░░░░░░░░░░░░░░░░░
# ░  ENVIRONMENT     ░
# ░░░░░░░░░░░░░░░░░░░░
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = HYPRCURSOR_SIZE,24

# ░░░░░░░░░░░░░░░░░░░░░
# ░  MONITOR SETUP    ░
# ░░░░░░░░░░░░░░░░░░░░░
# Format: monitor=<name>,<resolution>,<position>,<scale>
monitor = eDP-1, 1920x1080@143.998,0x0,1
monitor = HDMI-A-2, 1920x1080@60.00000, 1920x0, 1

# ░░░░░░░░░░░░░░░░░░░░░░
# ░  INPUT DEVICES     ░
# ░░░░░░░░░░░░░░░░░░░░░░
input {
    kb_layout = fr
    kb_variant =
    kb_model = pc105
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

gestures {
    workspace_swipe = true
}

# ░░░░░░░░░░░░░░░░░░░░
# ░  GENERAL OPTIONS  ░
# ░░░░░░░░░░░░░░░░░░░░
general {
    gaps_in = 4
    gaps_out = 4

    border_size = 2

    col.active_border = rgba($mauveAlphaee) rgba($lavenderAlphaee) 45deg
    col.inactive_border = rgba($surface1Alphacc)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 1
    rounding_power = 1

    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5 
        passes = 2 
        new_optimizations = on
        ignore_opacity = false
        xray = true
        popups = true
    }
}

# ░░░░░░░░░░░░░░░░░░░
# ░  AUTOSTART APPS ░
# ░░░░░░░░░░░░░░░░░░░

exec-once = ~/.config/hypr/scripts/swww_wallpaper_handler.sh
exec-once = waybar
exec-once = mako
exec-once = hyprlock
exec-once = hypridle

# ░░░░░░░░░░░░░░░░░░░░
# ░  WINDOW RULES     ░
# ░░░░░░░░░░░░░░░░░░░░
windowrulev2 = opacity 1.0, class:kitty
windowrulev2 = opacity 0.9, class:kitty,title:^(nvim.*)
# windowrule = size 800 600, ^(YourApp)$

# ░░░░░░░░░░░░░░░░░░░░
# ░  BINDINGS         ░
# ░░░░░░░░░░░░░░░░░░░░

source = $HOME/.config/hypr/bindings.conf

# ░░░░░░░░░░░░░░░░░░░░
# ░  ANIMATIONS       ░
# ░░░░░░░░░░░░░░░░░░░░
animations {
    enabled = yes, please

    # Custom Bezier curves
    bezier = smooth, 0.4, 0, 0.2, 1
    bezier = pop, 0.2, 0, 0.2, 1
    bezier = fastFade, 0.3, 0, 0.5, 1
    bezier = softFade, 0.25, 0.1, 0.25, 1
    bezier = workspaceSlide, 0.4, 0, 0.2, 1

    # Global settings
    animation = global, 1, 5, smooth

    # Borders
    animation = border, 1, 4, smooth

    # Windows movement / resize
    animation = windowsMove, 1, 4, smooth

    # Windows opening and closing
    animation = windows, 1, 4, smooth
    animation = windowsIn, 1, 3.5, pop, popin 85%
    animation = windowsOut, 1, 2.5, pop, popin 85%

    # Fading effects
    animation = fade, 1, 3, softFade
    animation = fadeIn, 1, 2.5, softFade
    animation = fadeOut, 1, 2.5, softFade
    animation = fadeSwitch, 1, 3, softFade
    animation = fadeShadow, 1, 4, softFade
    animation = fadeDim, 1, 3, softFade

    # Layers (popups, overlays)
    animation = layers, 1, 3.5, smooth
    animation = layersIn, 1, 3, smooth, fade
    animation = layersOut, 1, 2.5, fastFade, fade
    animation = fadeLayersIn, 1, 3, softFade
    animation = fadeLayersOut, 1, 2.5, softFade

    # Workspaces switch
    animation = workspaces, 1, 5, workspaceSlide, slide
    animation = workspacesIn, 1, 5, workspaceSlide, slide
    animation = workspacesOut, 1, 5, workspaceSlide, slide

    # Special workspaces
    animation = specialWorkspace, 1, 5, workspaceSlide, slide
}

# ░░░░░░░░░░░░░░░░░░░░░
# ░  LAYOUTS           ░
# ░░░░░░░░░░░░░░░░░░░░░
dwindle {
    pseudotile = true
    preserve_split = true
}

# ░░░░░░░░░░░░░░░░░░░░
# ░  MISC SETTINGS   ░
# ░░░░░░░░░░░░░░░░░░░░
misc {
    disable_hyprland_logo = true
}

