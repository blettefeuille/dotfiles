# Hyprland Configuration Template
# ------------------------------------------------------------

# CATPPUCCIN
source = ~/.config/hypr/mocha.conf

# ░░░░░░░░░░░░░░░░░░░░░
# ░  ENVIRONMENT     ░
# ░░░░░░░░░░░░░░░░░░░░
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = HYPRCURSOR_SIZE,24

# ░░░░░░░░░░░░░░░░░░░░░
# ░  MONITOR SETUP    ░
# ░░░░░░░░░░░░░░░░░░░░░
# Format: monitor=<name>,<resolution>,<position>,<scale>
monitor = eDP-1, 1920x1080@143.998,0x0,1

# ░░░░░░░░░░░░░░░░░░░░░░
# ░  INPUT DEVICES     ░
# ░░░░░░░░░░░░░░░░░░░░░░
input {
    kb_layout = fr
    kb_variant =
    kb_model = pc105
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

gestures {
    workspace_swipe = true
}

# ░░░░░░░░░░░░░░░░░░░░
# ░  GENERAL OPTIONS  ░
# ░░░░░░░░░░░░░░░░░░░░
general {
    gaps_in = 4
    gaps_out = 4

    border_size = 3

    col.active_border = rgba($mauveAlphaee) rgba($lavenderAlphaee) 45deg
    col.inactive_border = rgba($surface1Alphacc)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 1
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5 
        passes = 2 
        new_optimizations = on
        ignore_opacity = false
        xray = true
        popups = true
    }
}

# ░░░░░░░░░░░░░░░░░░░
# ░  AUTOSTART APPS ░
# ░░░░░░░░░░░░░░░░░░░

exec-once = ~/.config/hypr/scripts/swww_wallpaper_handler.sh
exec-once = waybar
exec-once = mako
exec-once = hyprlock
exec-once = hypridle

# ░░░░░░░░░░░░░░░░░░░░
# ░  WINDOW RULES     ░
# ░░░░░░░░░░░░░░░░░░░░
windowrulev2 = opacity 1.0, class:kitty
windowrulev2 = opacity 0.9, class:kitty,title:^(nvim.*)
# windowrule = size 800 600, ^(YourApp)$

# ░░░░░░░░░░░░░░░░░░░░
# ░  BINDINGS         ░
# ░░░░░░░░░░░░░░░░░░░░

source = $HOME/.config/hypr/bindings.conf

# ░░░░░░░░░░░░░░░░░░░░
# ░  ANIMATIONS       ░
# ░░░░░░░░░░░░░░░░░░░░
animations {
    enabled = yes, please

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# ░░░░░░░░░░░░░░░░░░░░░
# ░  LAYOUTS           ░
# ░░░░░░░░░░░░░░░░░░░░░
dwindle {
    pseudotile = true
    preserve_split = true
}

# ░░░░░░░░░░░░░░░░░░░░
# ░  MISC SETTINGS   ░
# ░░░░░░░░░░░░░░░░░░░░
misc {
    disable_hyprland_logo = true
}

