# ==============================================================================
# Kitty Configuration for Arch Linux + Hyprland + Tmux
# Using Catppuccin color scheme and Cascadia Code Nerd Font
# With Vim-style keybindings and Enhanced UI
# ==============================================================================

# Include modular config files
include ${HOME}/.config/kitty/themes/catppuccin.conf
include ${HOME}/.config/kitty/fonts.conf
include ${HOME}/.config/kitty/keybindings.conf
include ${HOME}/.config/kitty/ui.conf

# ==============================================================================
# Core Settings
# ==============================================================================

# Performance
repaint_delay 8
input_delay 1
sync_to_monitor yes

# Terminal bell
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# Shell integration
shell_integration enabled
allow_hyperlinks yes

# Miscellaneous
update_check_interval 0
clipboard_control write-clipboard write-primary read-clipboard read-primary
term xterm-kitty

# ==============================================================================
# Font configuration (fonts.conf)
# ==============================================================================

font_family      CaskaydiaCove Nerd Font
bold_font        CaskaydiaCove Nerd Font Bold
italic_font      CaskaydiaCove Nerd Font Italic
bold_italic_font CaskaydiaCove Nerd Font Bold Italic
font_size 11.0
adjust_line_height 1
disable_ligatures never
symbol_map U+E5FA-U+E6AC,U+E700-U+E7C5,U+F000-U+F2E0,U+E200-U+E2A9,U+F500-U+FD46,U+E300-U+E3E3,U+F400-U+F4A9,U+2665,U+26A1,U+F27C,U+E0A3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D2,U+E0D4,U+23FB-U+23FE,U+2B58,U+F300-U+F372,U+E000-U+E00A,U+EA60-U+EBEB,U+E276-U+E2D3 CaskaydiaCove Nerd Font

# ==============================================================================
# Catppuccin color scheme (themes/catppuccin.conf)
# ==============================================================================

# Catppuccin Mocha
foreground           #CDD6F4
background           #1E1E2E
selection_foreground #1E1E2E
selection_background #F5E0DC

# Cursor colors
cursor            #F5E0DC
cursor_text_color #1E1E2E

# URL underline color when hovering
url_color #F5E0DC

# Window borders
active_border_color #B4BEFE
inactive_border_color #6C7086
bell_border_color #F9E2AF

# The 16 terminal colors
# black
color0 #45475A
color8 #585B70

# red
color1 #F38BA8
color9 #F38BA8

# green
color2  #A6E3A1
color10 #A6E3A1

# yellow
color3  #F9E2AF
color11 #F9E2AF

# blue
color4  #89B4FA
color12 #89B4FA

# magenta
color5  #F5C2E7
color13 #F5C2E7

# cyan
color6  #94E2D5
color14 #94E2D5

# white
color7  #BAC2DE
color15 #A6ADC8

# ==============================================================================
# Keybindings (keybindings.conf)
# ==============================================================================

# Clipboard - Fixed paste functionality
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+v paste_from_clipboard
map shift+insert paste_from_clipboard

# Font size
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Single window mode (since using tmux for multiple windows)
map ctrl+shift+enter no_op
map ctrl+shift+w no_op
map ctrl+shift+] no_op
map ctrl+shift+[ no_op
map ctrl+shift+f no_op
map ctrl+shift+b no_op
map ctrl+shift+1 no_op
map ctrl+shift+2 no_op
map ctrl+shift+3 no_op
map ctrl+shift+4 no_op
map ctrl+shift+5 no_op

# Disable tab management (using tmux)
map ctrl+shift+t no_op
map ctrl+shift+q no_op
map ctrl+shift+right no_op
map ctrl+shift+left no_op
map ctrl+shift+. no_op
map ctrl+shift+, no_op

# Standard scrolling
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# Clear screen with Ctrl+L
map ctrl+l clear_terminal scroll active

# Ctrl+Arrow key support for word jumping
map ctrl+left send_text all \x1b[1;5D
map ctrl+right send_text all \x1b[1;5C
map ctrl+up send_text all \x1b[1;5A
map ctrl+down send_text all \x1b[1;5B

# Alt+Arrow key support
map alt+left send_text all \x1b[1;3D
map alt+right send_text all \x1b[1;3C
map alt+up send_text all \x1b[1;3A
map alt+down send_text all \x1b[1;3B

# Home/End key support
map home send_text all \x1bOH
map end send_text all \x1bOF

# Miscellaneous
map ctrl+shift+u kitten unicode_input
map ctrl+shift+f11 toggle_fullscreen
map ctrl+shift+r load_config_file

# UI Keybindings
map ctrl+shift+f6 set_background_opacity -0.05
map ctrl+shift+f7 set_background_opacity +0.05
map ctrl+shift+f8 set_background_opacity 1
map ctrl+shift+f9 set_background_opacity 0.9
map ctrl+shift+f10 toggle_maximized

# ==============================================================================
# Vim-style keybindings
# ==============================================================================

# Enable keyboard shortcuts for vim-like navigation
enabled_layouts all

# Vim-style scrolling in scrollback buffer
map ctrl+j scroll_line_down
map ctrl+k scroll_line_up
map ctrl+d scroll_page_down
map ctrl+u scroll_page_up
map ctrl+f scroll_page_down
map ctrl+b scroll_page_up
map shift+g scroll_end

# Vim-style visual mode and selection
# Enter visual mode
map ctrl+shift+v kitten kitty_grab/grab.py

# Disable vim-style window navigation keys that conflict with tmux
# but keep ctrl+l for clearing screen (remapped above)
map ctrl+h no_op
map ctrl+j no_op 
map ctrl+k no_op

# Disable vim-style resize windows (using tmux)
map ctrl+shift+h no_op
map ctrl+shift+l no_op
map ctrl+shift+k no_op
map ctrl+shift+j no_op

# Vim-style copy mode (requires kitty >= 0.24.0)
# Press ctrl+shift+escape to enter copy mode
map ctrl+shift+escape kitten hints --type path --program -

# Search like in vim (/)
map ctrl+shift+/ show_scrollback

# Mouse selection copy behavior
copy_on_select yes
select_by_word_characters @-./_~?&=%+#
strip_trailing_spaces smart

# ==============================================================================
# UI enhancements (ui.conf)
# ==============================================================================

# Window layout and appearance
remember_window_size  no
initial_window_width  900
initial_window_height 600
# Reduced vertical padding to allow text closer to edges
window_padding_width 3 3 3 3
placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.40
dynamic_background_opacity yes
dim_opacity 0.75

# Window borders and effects - minimal for tmux usage
draw_minimal_borders yes
window_border_width 0
window_margin_width 0
single_window_margin_width 0

# Cursor customization
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Mouse behavior
mouse_hide_wait 3.0
url_style curly
url_prefixes http https file ftp gemini irc gopher mailto news git
detect_urls yes
underline_hyperlinks hover
open_url_with default
copy_on_select yes
strip_trailing_spaces smart
focus_follows_mouse yes
pointer_shape_when_grabbed arrow

# Terminal bell
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# Tab bar - disabled for tmux users
tab_bar_edge bottom
tab_bar_style hidden
tab_bar_min_tabs 1

# Advanced rendering
repaint_delay 8
input_delay 1
sync_to_monitor yes

# Terminal scrollback buffer
scrollback_lines 20000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0
scrollback_fill_enlarged_window no
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# Terminal effects
background_tint 0.0
background_image none
background_image_layout tiled
background_image_linear no

# Terminal styling
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
cursor_blink_interval -1
shell_integration no-cursor

# Text rendering settings - maximize text area
# Allows text to get closer to window edges
text_composition_strategy legacy
placement_strategy top-left

# Hyperlink styling
hyperlink_rules
protocol file
    action launch --type=overlay --stdin-source=@selection_or_line $EDITOR @selection_or_line

protocol http
    action open_url

terminal_select_modifiers shift

# Kitty window logo (cool Nerd Font icon in window)
wayland_titlebar_color system
macos_titlebar_color system
wayland_window_icon_path ${HOME}/.config/kitty/kitty-icon.png
linux_display_server auto

# ==============================================================================
# Tmux-specific optimizations
# ==============================================================================

# Set terminal to optimize for tmux
term xterm-kitty

# Allow better color support for tmux
allow_remote_control yes

# Disable native tab bar completely
tab_bar_style hidden

# Set larger scrollback for tmux integration
scrollback_lines 20000

# Better window handling (single instance kitty)
single_instance yes

# Don't confirm when closing window with tmux session
confirm_os_window_close 0

# Enable OSC 52 clipboard handling for tmux
clipboard_control write-clipboard write-primary read-clipboard read-primary no-append

# Ensure proper key mapping is sent to tmux/applications
map alt+enter send_text all \x1b\r

# Fix key codes for proper functionality
shell_integration enabled
clear_all_shortcuts no
